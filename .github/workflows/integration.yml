name: Integration tests

# Только ручной запуск: тесты делают реальные вызовы LLM через OpenRouter.
on:
  workflow_dispatch:

env:
  # vars.OPENROUTER_MODEL можно не задавать — тогда берём модель по умолчанию.
  OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'qwen/qwen3-30b-a3b-instruct-2507' }}

jobs:
  integration:
    name: pytest -m integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      # Без ключа тесты скипаются сами и job зеленеет впустую — падаем явно.
      - name: Check credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::secret OPENROUTER_API_KEY не задан в настройках репозитория"
            exit 1
          }

      - name: Run integration tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run pytest -m integration -q
