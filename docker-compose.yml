services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mtbank-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - ENABLE_PIPELINES=true
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=${PIPELINES_API_KEY:-0p3n-w3bu!}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - pipelines
    networks:
      - mtbank

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: mtbank-pipelines
    restart: unless-stopped
    ports:
      - "9099:9099"
    environment:
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:-0p3n-w3bu!}
      - ANALYZE_API_URL=http://api:8000
      - OPENWEBUI_BASE_URL=http://openwebui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
    volumes:
      - ./pipelines:/app/pipelines
      - pipelines_data:/app/pipelines_data
    depends_on:
      - api
    networks:
      - mtbank

  api:
    build: .
    container_name: mtbank-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - WHISPER_DOWNLOAD_ROOT=/models/whisper
      - HF_HOME=/models/hf
    volumes:
      - whisper_cache:/models/whisper
      - hf_cache:/models/hf
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      - mtbank

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mtbank-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - mtbank

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mtbank-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mtbank

volumes:
  openwebui_data:
  pipelines_data:
  whisper_cache:
  hf_cache:
  prometheus_data:
  grafana_data:

networks:
  mtbank:
    driver: bridge
